[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mteapy"
version = "0.1.2"
authors = [
     {name = "Xavier Benedicto Molina", email = "xavier.benedicto@bsc.es"},
     {name = "Miguel Ponce de Leon", email = "miguel.ponce@bsc.es"}
]
description = "Python library for Metabolic Task Enrichment Analysis"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
classifiers=[
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
dependencies = [
    "numpy",
    "pandas",
    "cobra>=0.25.0",
    "rich_argparse",
    # Not yet on PyPI -- private repo, needs SSH access. Once published, make this a bare "cobra-netgraph".
    "cobra-netgraph @ git+ssh://git@github.com/migp11/cobra-netgraph.git",
]

[project.scripts]
run-mtea = "mteapy.cmds.run_mtea:main"

[project.urls]
"Homepage" = "https://github.com/bsc-life/mteapy"
"Bug Tracker" = "https://github.com/bsc-life/mteapy/issues"

[project.optional-dependencies]
test = ["pytest", "httpx"]
# The local visualizer in webapp/ (not needed to use mteapy as a library or CLI).
webapp = ["fastapi", "uvicorn", "python-multipart"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"mteapy.data" = ["*"]
# Per-model folders (manifest, model, routes database, task files, annotations).
"mteapy" = ["data/models/*/*", "data/models/*/*/*"]